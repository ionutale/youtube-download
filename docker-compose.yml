version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=22-bookworm-slim
    # image: youtube-download:latest
    container_name: youtube-download
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SVELTE_ADAPTER=node
      - DOWNLOAD_DIR=/data
      - MONGODB_URI=mongodb://root:password@mongo:27017
    ports:
      - "3000:3000"
    volumes:
      - ./download:/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: youtube-download-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data: